model:
  img_channels: 1
  base_channels: 48
  window_size: 8
  token_ratio: 0.12   # percent of tokens selected by SDT (0~1)
  memory_tokens: 16
  enable_dqr: true

train:
  epochs: 120
  img_size: 512
  batch_size: 8
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
  cosine: true
  workers: 4
  seed: 42

loss:
  focal_gamma: 2.0
  focal_alpha: 0.25
  lambda_lovasz: 1.0
  lambda_boundary: 1.0
  lambda_bg: 0.5

augment:
  hflip: true
  random_scale: [0.75, 1.25]
  gamma: [0.8, 1.2]

logging:
  save_dir: runs/exp
  print_freq: 50